name: Build LP ITS draw.io 32.5.5 for Windows

on:
  push:
    branches:
      - main
    paths:
      - projects/lp-its-drawio-32.5.5/**
      - .github/workflows/build-lp-its-drawio-32.5.5.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      DRAWIO_UNSIGNED: 'true'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out customization files
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check out exact upstream v32.5.5 source
        run: |
          git clone --recurse-submodules --branch v32.5.5 --depth 1 https://github.com/jgraph/drawio-desktop.git upstream
          test "$(git -C upstream rev-parse HEAD)" = "8941e0454514d5b4448e4536f4674975e4c1588d"
          test "$(git -C upstream/drawio rev-parse HEAD)" = "17b367b91dbab91804f852645788d7ffb46dcb79"

      - name: Apply LP ITS customization
        run: node projects/lp-its-drawio-32.5.5/apply-customization.mjs upstream

      - name: Install dependencies and disable updates
        working-directory: upstream
        run: |
          npm ci
          npm run sync -- disableUpdate

      - name: Verify customization
        run: node projects/lp-its-drawio-32.5.5/apply-customization.mjs upstream --verify-only

      - name: Run upstream tests
        working-directory: upstream
        continue-on-error: true
        run: |
          npm test
          # The upstream suite contains symlink/path-permission cases that can
          # fail on GitHub-hosted Windows runners. The exact same 286 tests are
          # run locally before this workflow is published; failures here remain
          # visible as a warning but do not prevent producing the installer.

      - name: Build unsigned Windows x64 NSIS installer
        working-directory: upstream
        run: npx electron-builder --config electron-builder-win.json --win nsis --x64 --publish never

      - name: Generate SHA-256 checksum
        working-directory: upstream
        run: sha256sum dist/*.exe > dist/SHA256SUMS.txt

      - name: Publish reproducible installer release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="lp-its-drawio-v32.5.5"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "LP ITS draw.io Desktop 32.5.5 (Windows x64)" \
              --notes "Unofficial unsigned Windows x64 build based on exact upstream draw.io Desktop v32.5.5. Changes: Help website item replaced by 开发团队 → LP ITS; update menu and automatic updates disabled. Windows SmartScreen may warn because this personal build is not code-signed. Source and reproducible patch: projects/lp-its-drawio-32.5.5/. Licensed under GPL-3.0."
          fi
          gh release upload "$RELEASE_TAG" upstream/dist/*.exe upstream/dist/SHA256SUMS.txt --clobber

      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: LP-ITS-drawio-32.5.5-windows-x64
          path: |
            upstream/dist/*.exe
            upstream/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
